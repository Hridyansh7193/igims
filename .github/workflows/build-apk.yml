name: Build Android Gate Scanner APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Build Web Assets
        run: npm run build

      - name: Set up Java JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Sync Capacitor Android
        run: npx cap sync android

      - name: Build Android Debug APK
        run: |
          cd android
          chmod +x ./gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Prepare APK Asset
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk ./Cerebrexia-Gate-Scanner.apk

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Cerebrexia-Gate-Scanner-APK
          path: ./Cerebrexia-Gate-Scanner.apk
          retention-days: 30

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: scanner-apk-v1.0
          name: "Cerebrexia '26 Gate Scanner APK"
          body: |
            ### Official Cerebrexia '26 Gate Scanner App (Android)
            
            This APK is for festival gate volunteers and security personnel to scan and verify attendee passes across all 4 festival days (17, 18, 19, and 20 December 2026).

            #### Features:
            * High-speed live camera QR code scanner with flash/torch support.
            * Strictly enforces 1 entry per day per QR code at database level.
            * Visual green (Entry Granted) and red (Already Entered Today) screens with audible feedback.
            * Live scan counter and manual search fallback.

            **Direct Download:** Click `Cerebrexia-Gate-Scanner.apk` below to download and install.
          files: ./Cerebrexia-Gate-Scanner.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
